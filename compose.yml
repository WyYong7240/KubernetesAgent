services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: kubernetes_agent
      POSTGRES_USER: ops_agent
      POSTGRES_PASSWORD: ops_agent_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops_agent -d kubernetes_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
